<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45B7D1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Monitor bezel -->
  <rect x="2" y="3" width="28" height="20" rx="2" ry="2" fill="#333" stroke="#555" stroke-width="0.5"/>
  
  <!-- Screen -->
  <rect x="4" y="5" width="24" height="16" rx="1" ry="1" fill="url(#screenGrad)"/>
  
  <!-- Screen content lines -->
  <rect x="6" y="7" width="8" height="1.5" rx="0.5" fill="#fff" opacity="0.8"/>
  <rect x="6" y="10" width="12" height="1" rx="0.5" fill="#fff" opacity="0.6"/>
  <rect x="6" y="12.5" width="6" height="1" rx="0.5" fill="#fff" opacity="0.6"/>
  
  <!-- MCP logo/icon -->
  <circle cx="22" cy="15" r="3" fill="#FFD93D" opacity="0.9"/>
  <text x="22" y="17" font-family="Arial" font-size="3" fill="#333" text-anchor="middle" font-weight="bold">M</text>
  
  <!-- Monitor stand -->
  <rect x="14" y="23" width="4" height="3" fill="#333"/>
  <rect x="10" y="26" width="12" height="2" rx="1" fill="#333"/>
</svg> 